name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Generate FastAPI server
        run: make generate-server CONTAINER_RUNTIME=docker

      - name: Check generated API is current
        run: |
          git diff --exit-code -- src/training_service_api
          test -z "$(git status --porcelain --untracked-files=all -- src/training_service_api)"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.19.0

      - name: Unit tests
        run: uv run pytest

      - name: Lint Helm chart
        run: make helm-lint

      - name: Render Helm manifests
        run: make helm-template
