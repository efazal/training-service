apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "training-service.fullname" . }}
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "training-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "training-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "training-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.writableTemp.enabled .Values.volumes }}
      volumes:
        {{- if .Values.writableTemp.enabled }}
        - name: training-service-tmp
          emptyDir:
            sizeLimit: {{ .Values.writableTemp.sizeLimit | quote }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: training-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          {{- if or .Values.writableTemp.enabled .Values.env .Values.algorithmCatalog.name }}
          env:
            {{- if .Values.writableTemp.enabled }}
            - name: HF_HOME
              value: /tmp/huggingface
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.algorithmCatalog.name }}
            - name: TRAINING_SERVICE_CATALOG_NAME
              value: {{ .Values.algorithmCatalog.name | quote }}
            - name: TRAINING_SERVICE_CATALOG_NAMESPACE
              value: {{ .Values.algorithmCatalog.namespace | default .Release.Namespace | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.writableTemp.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.writableTemp.enabled }}
            - name: training-service-tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
