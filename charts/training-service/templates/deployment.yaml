{{- $runtimeImage := include "training-service.runtimeImage" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "training-service.fullname" . }}
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "training-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/algorithm-exporter: {{ .Files.Get "files/export_algorithm_catalog.py" | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "training-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "training-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        {{- if .Values.writableTemp.enabled }}
        - name: training-service-tmp
          emptyDir:
            sizeLimit: {{ .Values.writableTemp.sizeLimit | quote }}
        {{- end }}
        - name: training-algorithm-catalog
          emptyDir: {}
        {{- if $runtimeImage }}
        - name: training-algorithm-exporter
          configMap:
            name: {{ include "training-service.fullname" . }}-algorithm-exporter
        - name: training-runtime-tmp
          emptyDir: {}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if $runtimeImage }}
      initContainers:
        - name: discover-algorithms
          image: {{ $runtimeImage | quote }}
          imagePullPolicy: Always
          command:
            - python
            - /opt/algorithm-exporter/export_algorithm_catalog.py
            - {{ $runtimeImage | quote }}
            - /var/run/training-service/catalog/catalog.json
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: training-algorithm-exporter
              mountPath: /opt/algorithm-exporter
              readOnly: true
            - name: training-algorithm-catalog
              mountPath: /var/run/training-service/catalog
            - name: training-runtime-tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: training-service
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          env:
            {{- if .Values.writableTemp.enabled }}
            - name: HF_HOME
              value: /tmp/huggingface
            {{- end }}
            - name: TRAINING_SERVICE_CATALOG_PATH
              value: /var/run/training-service/catalog/catalog.json
            {{- if $runtimeImage }}
            - name: TRAINING_RAY_IMAGE
              value: {{ $runtimeImage | quote }}
            {{- end }}
            {{- range .Values.env }}
            {{- if ne .name "TRAINING_RAY_IMAGE" }}
            {{- toYaml (list .) | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.writableTemp.enabled }}
            - name: training-service-tmp
              mountPath: /tmp
            {{- end }}
            - name: training-algorithm-catalog
              mountPath: /var/run/training-service/catalog
              readOnly: true
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
