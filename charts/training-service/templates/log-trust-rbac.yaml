{{- if include "training-service.discoverLogCA" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "training-service.fullname" . }}-{{ .Release.Namespace }}-log-trust
  namespace: openshift-config-managed
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["default-ingress-cert"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "training-service.fullname" . }}-{{ .Release.Namespace }}-log-trust
  namespace: openshift-config-managed
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "training-service.fullname" . }}-{{ .Release.Namespace }}-log-trust
subjects:
  - kind: ServiceAccount
    name: {{ include "training-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
