replicaCount: 1

image:
  repository: quay.io/opendatahub/training-service
  pullPolicy: IfNotPresent
  tag: ""

# Ray workload image containing Training Hub, separate from the API service image.
# Required for training submissions; use a tested image tag or digest for your cluster.
trainingRuntime:
  image: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers and authorize project-scoped operations through Kubernetes
# TokenReview and SubjectAccessReview APIs. The service account can create only
# these review requests; it does not receive workload permissions.
authentication:
  tokenReview:
    enabled: true

# Additional settings, such as the Ray gateway URL and trusted CA path.
# Use trainingRuntime.image instead of setting TRAINING_RAY_IMAGE here.
env: []
envFrom: []

# The read-only container needs bounded scratch space for Python tempfile and
# Hugging Face dataset metadata/cache during submission preflight.
writableTemp:
  enabled: true
  sizeLimit: 512Mi

# Existing ConfigMap with catalog.json from the selected training runtime.
# Reads use the caller's identity, not the service account. See docs/algorithm-discovery.md.
algorithmCatalog:
  name: ""
  namespace: "" # defaults to the Helm release namespace

# For example, mount a ConfigMap containing the trusted Ray gateway CA.
volumes: []
volumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
