replicaCount: 1

image:
  repository: quay.io/opendatahub/training-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers and authorize project-scoped operations through Kubernetes
# TokenReview and SubjectAccessReview APIs. The service account can create only
# these review requests; it does not receive workload permissions.
authentication:
  tokenReview:
    enabled: true

# Runtime configuration is intentionally generic until the authentication,
# authorization, and SDK work defines the service's stable environment names.
env: []
envFrom: []

# For example, mount a ConfigMap containing the trusted Ray gateway CA.
volumes: []
volumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: false
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
