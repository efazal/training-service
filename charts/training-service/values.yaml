replicaCount: 1

image:
  # Intended public release repository; requires publication by a modh maintainer.
  # Until published, override repository/tag with an available service image.
  repository: quay.io/modh/training-service
  pullPolicy: IfNotPresent
  tag: "0.1.0"

# Ray workload image containing Training Hub, separate from the API service image.
# An init container discovers its Training Hub algorithms automatically, without a GPU.
# Public default matches the API image's Ray 2.58.0 pin and includes Training Hub 0.8.1.
# Override with a tested image digest for your cluster when needed.
trainingRuntime:
  image: quay.io/modh/ray:2.58.0-py312-cu129-th081

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers and authorize project-scoped operations through Kubernetes
# TokenReview and SubjectAccessReview APIs. The service account can create only
# these review requests; it does not receive workload permissions.
authentication:
  tokenReview:
    enabled: true

# Additional settings, such as the Ray gateway URL and trusted CA path.
# Use trainingRuntime.image instead of setting TRAINING_RAY_IMAGE here.
env: []
envFrom: []

# The read-only container needs bounded scratch space for Python tempfile and
# Hugging Face dataset metadata/cache during submission preflight.
writableTemp:
  enabled: true
  sizeLimit: 512Mi

# For example, mount a ConfigMap containing the trusted Ray gateway CA.
volumes: []
volumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
