replicaCount: 1

image:
  # Intended public release repository; requires publication by a modh maintainer.
  # Until published, override repository/tag with an available service image.
  repository: quay.io/modh/training-service
  pullPolicy: IfNotPresent
  tag: "0.1.0"

# Ray workload image containing Training Hub, separate from the API service image.
# An init container discovers its Training Hub algorithms automatically, without a GPU.
# Public default includes Ray 2.58.0, CUDA 13.0 and Training Hub 0.11.2.
# Override with a tested image digest for your cluster when needed.
trainingRuntime:
  image: quay.io/modh/ray:2.58.0-py312-cu130-th0112
  # Alternatives: ensure the chosen Ray version matches your API/SDK deployment.
  # image: quay.io/modh/ray:2.55.1-py312-cu129-th081
  # image: quay.io/modh/ray:2.58.0-py312-cu129-th081

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # TokenReview requires the pod to authenticate as its service account.
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Authenticate callers and authorize project-scoped operations through Kubernetes
# TokenReview and SubjectAccessReview APIs. The service account can create only
# these review requests and read the named platform gateway configuration;
# it does not receive workload permissions.
authentication:
  tokenReview:
    enabled: true

# By default the service discovers GatewayConfig/default-gateway status.domain
# on log requests. Set gatewayURL only to override discovery for a custom platform.
logBackend:
  gatewayURL: ""
  streamTimeoutSeconds: 300
  trustedCA:
    # Default OpenShift install: automatically read the public ingress CA from
    # openshift-config-managed/default-ingress-cert. No CA file or ConfigMap setup.
    # New log connections pick up platform certificate rotation within 60 seconds.
    autoDiscover: true
    # Optional custom trust overrides; leave empty for the standard installation.
    # configMapName references an existing ConfigMap in the service namespace.
    # bundle supplies public PEM certificates for Helm to create a ConfigMap.
    # Either override takes precedence over automatic discovery.
    configMapName: ""
    key: ca-bundle.crt
    bundle: ""

# Additional settings. Prefer the structured settings above and trainingRuntime.image.
# Legacy gateway/CA environment variables remain supported; do not configure both.
env: []
envFrom: []

# The read-only container needs bounded scratch space for Python tempfile and
# Hugging Face dataset metadata/cache during submission preflight.
writableTemp:
  enabled: true
  sizeLimit: 512Mi

# For example, mount a ConfigMap containing the trusted Ray gateway CA.
volumes: []
volumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  annotations: {}
  host: ""
  path: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
