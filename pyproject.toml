[project]
name = "training-service"
version = "0.1.0"
description = "OpenDataHub Training Service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["opendatahub", "training", "kubernetes", "ray", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "codeflare-sdk @ https://packages.redhat.com/api/pulp-content/public-rhai/rhoai/3.6/cpu-ubi9/codeflare_sdk-0.38.2-1-py3-none-any.whl#sha256=9a83abc5587e22befe055e47c06b7336b9def34b6d8fe1d33008e6e55e39ee0a",
    "ray[data,default]==2.55.1",
    # The RHOAI 3.6 Ray wheel imports colorama but does not declare it.
    "colorama==0.4.6",
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "kubernetes>=31,<36",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
training-service = "training_service.main:run"

[project.urls]
Homepage = "https://github.com/opendatahub-io/training-service"
Repository = "https://github.com/opendatahub-io/training-service"
Issues = "https://github.com/opendatahub-io/training-service/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/training_service", "src/training_service_api"]

[tool.hatch.build.targets.wheel.force-include]
"docs/api/openapi.yaml" = "training_service/openapi.yaml"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.11,<1",
    "types-PyYAML>=6,<7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".idea"]
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["training_service", "training_service_api"]

[tool.ruff.lint.per-file-ignores]
# Keep the generator's str/Enum semantics; StrEnum changes str(member).
"src/training_service_api/**/*.py" = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["^src/training_service_api/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["training_service_api.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["training_service"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
