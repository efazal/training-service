# Copy outside the repo. Supply your authenticated Ray gateway.
# The runner discovers the cluster's public ingress CA and provisions the CA ConfigMap.
# Use --ray-ca-bundle only when the gateway needs a different issuer.
# Never put tokens, passwords or Secret values here.
imagePullSecrets: [] # For private Quay images use --use-podman-auth; the runner sets the reference.
# Uses the chart's public Ray + Training Hub default. Optional runtime override:
# trainingRuntime:
#   image: quay.io/modh/ray@sha256:REPLACE_WITH_TESTED_DIGEST
env:
  - name: TRAINING_SERVICE_RAY_GATEWAY_URL
    value: https://YOUR_AUTHENTICATED_RAY_GATEWAY
  - name: TRAINING_SERVICE_RAY_CA_FILE
    value: /var/run/training-service/ray-ca/ca.crt
volumes:
  - name: ray-gateway-ca
    configMap:
      name: training-service-ray-ca
volumeMounts:
  - name: ray-gateway-ca
    mountPath: /var/run/training-service/ray-ca
    readOnly: true
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
