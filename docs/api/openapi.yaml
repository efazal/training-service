openapi: 3.0.3
info:
  title: Training API - RHOAI 3.6 Developer Preview
  description: >
    Minimal Training API for Ray-backed training jobs in the RHOAI 3.6 GA
    timeframe. Distributed separately through a Helm chart in the same ODH
    repository as the Python/FastAPI service; no Training API operator.
    Submission uses CodeFlare's managed RayJob SDK path; the SDK creates the
    RayJob custom resource, and the service does not hand-author RayJob manifests.
    The service is stateless and keeps no durable job database.
    Requests authenticate the caller, propagate caller identity, and enforce
    existing OpenShift permissions and project isolation without privilege
    elevation. Supports submission, listing, job details, logs, and deletion of
    terminal RayJob resources. Cancel, pause, and resume are outside this
    Developer Preview. Resource estimation is a stretch goal. Job discovery,
    details, and terminal deletion use caller-authorized Kubernetes APIs for
    RayJob resources; driver logs use the Ray Jobs SDK.
  version: 1.4.0-dp
servers:
  - url: https://taas.openshift.example.com/api/v1
    description: Training API deployment (example URL)

security:
  - OpenShiftBearer: []

paths:
  /training-jobs/estimate:
    post:
      summary: Estimate training resources (stretch goal)
      x-dp-scope: stretch
      description: >
        Optional stretch goal, not required for Developer Preview acceptance.
        Returns GPU-memory bounds and, where supported, a timing range. Timing
        estimation is experimental and currently supports single-node SFT or
        OSFT only: it reads a JSONL dataset and runs a real sample training pass,
        so this synchronous request can take
        significant time and use compute. Unsupported timing returns the memory
        estimate with a warning and omits duration. This endpoint does not accept
        Secret references or submit a RayJob. Models must be loadable without a
        caller Secret; the estimator may download a public Hugging Face model.
      operationId: estimateTrainingJob
      tags:
        - Estimations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEstimationRequest'
      responses:
        '200':
          description: Synchronous GPU-memory estimate and, when supported, a timing range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobEstimationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'

  /algorithms:
    get:
      summary: List available Ray training algorithms
      description: >
        Read-only submission helper. Uses Kubernetes APIs directly under the
        caller's identity to discover the catalog and parameter schemas exposed
        by the configured Ray Universal Image for this deployment. The catalog
        is release- and image-specific; it is not a universal hardcoded list.
      operationId: listAlgorithms
      tags:
        - Infrastructure & Discovery
      responses:
        '200':
          description: Configured-image catalog of available algorithms and hyperparameter schemas
          content:
            application/json:
              schema:
                type: object
                required:
                  - algorithms
                properties:
                  algorithms:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlgorithmDescriptor'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /projects/{project}/training-jobs:
    post:
      summary: Submit a Ray training job in an OpenShift Project
      description: >
        Validates the training request and submits it through CodeFlare's
        managed RayJob SDK path. CodeFlare creates the RayJob resource; the
        service does not hand-author a RayJob manifest. The project path defines
        the target namespace for the submission and all referenced queues,
        connections, Secrets, and PVCs. Model and dataset URIs use
        hf://<secret-name>/<hub-repository-id>,
        s3://<connection-name>/<bucket-name>/<path>, or
        pvc://<pvc-name>/<path>. Output uses an S3 or PVC destination URI.
        The URI scheme identifies the source; separate source and secret_ref
        fields are not accepted. Every Hugging Face input requires a Secret
        reference, including public repositories. References identify existing
        resources in this project, never credential values or another namespace.
        These are Training API locators: the adapter must resolve them into
        usable storage configuration before CodeFlare/Ray submission, not pass
        them through as native SDK URIs. S3 connections supply endpoint and
        authentication configuration; the URI supplies the bucket and path.
        PVC paths are relative to the volume root and must not escape it.
        Connections and PVCs are not created automatically. Invalid locators
        return 422, insufficient caller permissions return 403, and missing
        referenced project resources return 404. Caller identity is derived
        from the authenticated OpenShift token and propagated through the
        submission path; identity and group claims supplied in request fields
        or untrusted headers must not be used for authorization.
        Records the authenticated caller's username in the RayJob annotation
        training.rhoai.io/submitted-by for later detail reads. This attribution
        is informational and must not be used for authorization.
        The implementation must also retain the accepted, non-secret POST
        payload in caller-authorized RayJob metadata for subsequent detail
        reads, preserving supplied values and leaving omitted optional settings
        absent. Secret references retain names only, never Secret contents or
        caller tokens. CodeFlare does not automatically retain this API payload;
        retaining it requires a caller-authorized metadata integration, not a
        service database or hand-authored RayJob manifest.
        Every downstream operation must enforce the caller's existing OpenShift
        permissions. A project name or Ray endpoint connectivity alone does not
        establish authorization. There is no fallback to an elevated service identity.
        A successful response acknowledges RayJob creation, not that the Ray
        job has started or completed. The returned id is the RayJob name and can
        be used with the detail and log endpoints in the same project.
      operationId: createTrainingJob
      x-project-authorization:
        group: ray.io
        resource: rayjobs
        verb: create
      tags:
        - Training Jobs
      parameters:
        - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            examples:
              huggingface_inputs_s3_output:
                summary: HF inputs with a named Secret and S3 output with a named connection
                value:
                  name: llama3-8b-alpaca-lora
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B
                  dataset:
                    uri: hf://hf-secret-token/tatsu-lab/alpaca
                  algorithm:
                    name: lora_sft
                    parameters:
                      learning_rate: 0.00002
                      num_epochs: 3
                      effective_batch_size: 8
                      max_seq_len: 2048
                  resources:
                    num_nodes: 2
                    gpus_per_node: 4
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "16"
                    memory_per_node: "64Gi"
                  output:
                    destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/
              s3_inputs:
                summary: S3 inputs referencing project-local connections
                value:
                  name: s3-training
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: s3://model-storage/my-ml-bucket/models/llama3/
                  dataset:
                    uri: s3://training-data/my-ml-bucket/datasets/alpaca/train.jsonl
                  algorithm:
                    name: lora_sft
                    parameters:
                      learning_rate: 0.00002
                      num_epochs: 3
                      effective_batch_size: 8
                      max_seq_len: 2048
                  resources:
                    num_nodes: 2
                    gpus_per_node: 4
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "16"
                    memory_per_node: "64Gi"
                  output:
                    destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/s3-training/
              pvc_inputs_output:
                summary: Existing PVCs for input data and saved output
                value:
                  name: pvc-training
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: pvc://model-storage/models/llama3/
                  dataset:
                    uri: pvc://training-data/datasets/alpaca/train.jsonl
                  algorithm:
                    name: lora_sft
                    parameters:
                      learning_rate: 0.00002
                      num_epochs: 3
                      effective_batch_size: 8
                      max_seq_len: 2048
                  resources:
                    num_nodes: 2
                    gpus_per_node: 4
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "16"
                    memory_per_node: "64Gi"
                  output:
                    destination_uri: pvc://training-output/checkpoints/pvc-training/
      responses:
        '202':
          description: RayJob created; training execution proceeds asynchronously
          headers:
            Location:
              description: Relative URL of the created job's detail resource.
              schema:
                type: string
              example: /api/v1/projects/team-alpha-ml/training-jobs/llama3-8b-alpaca-lora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobSubmission'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: A RayJob with the requested name already exists in the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: already_exists
                message: A RayJob with this name already exists in the project.
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
        '501':
          $ref: '#/components/responses/501NotImplemented'

    get:
      summary: List training jobs in an OpenShift Project
      description: >
        Lists RayJob custom resources from the target Kubernetes namespace using
        the caller's existing permissions. This includes caller-readable RayJobs
        submitted outside this API. The service does not filter by API ownership.
        Returns compact summaries containing id, status, and created_at, with
        queue_name when available. Each created_at is the RayJob resource's
        Kubernetes metadata.creationTimestamp, including for external jobs;
        it is not the training start time. Use the job detail endpoint for full
        details. An accessible project with no matching jobs returns 200 with
        items: [] and total_count: 0.
        When status is omitted, no status filter is applied: jobs in every
        status are eligible, including terminal jobs. All caller-readable jobs
        in the project are returned across pages, subject to any other supplied
        filter; this is not an unbounded single response.
        total_count is the exact number of caller-readable RayJobs matching all
        supplied filters across all pages, counted before applying the API page
        limit. With no filters, it counts all caller-readable jobs in the
        project. The implementation must evaluate the authorized job inventory
        to compute this count, not use the current page length or Kubernetes
        remainingItemCount as the total. The count reflects the current request
        and may change between requests.
        Filters and pagination are applied to the authorized results; every page
        rechecks caller permissions and pagination is not a durable snapshot.
      operationId: listTrainingJobs
      x-request-context: true
      x-project-authorization:
        group: ray.io
        resource: rayjobs
        verb: list
      tags:
        - Training Jobs
      parameters:
        - $ref: '#/components/parameters/Project'
        - name: status
          in: query
          required: false
          description: >
            Optional exact-status filter. When omitted, includes jobs in all
            statuses, subject to caller access, other filters, and pagination.
            There is no default status filter or ALL status value.
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: queue_name
          in: query
          required: false
          description: Filter by queue name recorded in training submission metadata.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: page_token
          in: query
          description: >
            Opaque continuation token for the same project and filters. The
            token never grants access; every request rechecks caller permissions.
          schema:
            type: string
      responses:
        '200':
          description: Compact page of authorized training jobs and total matching count; an empty result has items empty and total_count zero
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total_count
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingJobSummary'
                  total_count:
                    type: integer
                    format: int64
                    minimum: 0
                    description: >
                      Exact number of caller-readable jobs matching the supplied
                      filters across all pages before pagination, not the page
                      length or the number of remaining jobs. With no filters,
                      counts all caller-readable jobs in the project. Reflects
                      the current request and may change between requests.
                  next_page_token:
                    type: string
                    description: Omitted when no further results are available.
              examples:
                jobs:
                  summary: Mixed-status page when status is omitted
                  value:
                    total_count: 12
                    items:
                      - id: llama3-8b-alpaca-lora
                        status: RUNNING
                        queue_name: team-alpha-local-queue
                        created_at: '2026-10-04T09:00:00Z'
                      - id: external-ray-job
                        status: PENDING
                        created_at: '2026-10-04T09:05:00Z'
                      - id: completed-ray-job
                        status: SUCCEEDED
                        created_at: '2026-10-04T08:30:00Z'
                      - id: failed-ray-job
                        status: FAILED
                        created_at: '2026-10-04T08:00:00Z'
                      - id: externally-stopped-ray-job
                        status: STOPPED
                        created_at: '2026-10-04T07:30:00Z'
                    next_page_token: opaque-next-page-token
                filtered_by_status:
                  summary: Compact list with status=RUNNING
                  value:
                    total_count: 1
                    items:
                      - id: llama3-8b-alpaca-lora
                        status: RUNNING
                        queue_name: team-alpha-local-queue
                        created_at: '2026-10-04T09:00:00Z'
                empty_project:
                  summary: Accessible project with no jobs
                  value:
                    total_count: 0
                    items: []
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /projects/{project}/training-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/JobId'

    get:
      summary: Get training job status and available details
      description: >
        Gets the RayJob resource from the target namespace using the caller's
        existing Kubernetes permissions. The id is the RayJob name. Maps
        RayJob provisioning/waiting states to PENDING and reports the Ray job's
        RUNNING, SUCCEEDED, FAILED, or STOPPED state when available. No job state
        is stored by this service. Metrics and progress are optional and omitted
        unless exposed by an authorized source; they are not inferred.
        finished_at reports the Ray execution end time for SUCCEEDED, FAILED,
        or STOPPED jobs when available. It is omitted for pending or running
        jobs and when Ray has not reported an end time; no timestamp is invented.
        For API-created jobs, includes the accepted POST payload in submission,
        recovered from caller-authorized RayJob metadata rather than a service
        database. Preserves submitted values and omits optional settings that
        were not supplied; it does not reconstruct the payload from command-line
        arguments or raw runtime environments. Top-level resources reports
        runtime configuration when available; submission.resources retains the
        submitted settings. External or older jobs without submission metadata
        omit submission. Named references in storage URIs may be included, but
        Secret contents, caller tokens, and raw Ray runtime-environment dumps
        are never returned.
        Includes submitted_by when the RayJob has the
        training.rhoai.io/submitted-by annotation recorded at submission. It
        identifies the original submitter, never the caller making this GET.
        Jobs without this annotation, including externally submitted jobs,
        omit submitted_by. Attribution is informational, may be modified by
        callers with metadata patch permissions, and is never an authorization input.
      operationId: getTrainingJob
      x-request-context: true
      x-project-authorization:
        group: ray.io
        resource: rayjobs
        verb: get
        resourceNameParameter: job_id
      tags:
        - Training Jobs
      responses:
        '200':
          description: Accepted submission configuration, current RayJob status, and all available job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJob'
              examples:
                api_submitted_job:
                  summary: Full job details with accepted submission and submitter attribution
                  value:
                    id: llama3-8b-alpaca-lora
                    name: llama3-8b-alpaca-lora
                    project: team-alpha-ml
                    status: RUNNING
                    selected_backend: ray
                    queue_name: team-alpha-local-queue
                    submitted_by: alice
                    submission:
                      name: llama3-8b-alpaca-lora
                      queue_name: team-alpha-local-queue
                      backend: ray
                      model:
                        uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                        parameters:
                          learning_rate: 0.00002
                          num_epochs: 3
                          effective_batch_size: 8
                          max_seq_len: 2048
                      resources:
                        num_nodes: 2
                        gpus_per_node: 4
                        gpu_type: nvidia.com/gpu
                        cpus_per_node: "16"
                        memory_per_node: "64Gi"
                      output:
                        destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/
                    progress:
                      percentage: 45.5
                      current_epoch: 2
                      total_epochs: 3
                      current_step: 910
                      total_steps: 2000
                      eta_seconds: 1240
                    metrics:
                      loss: 0.184
                      eval_loss: 0.212
                      learning_rate: 0.000015
                      throughput_tokens_per_sec: 1420.5
                    resources:
                      num_nodes: 2
                      gpus_per_node: 4
                      gpu_type: nvidia.com/gpu
                      cpus_per_node: "16"
                      memory_per_node: "64Gi"
                    created_at: '2026-10-04T09:00:00Z'
                    started_at: '2026-10-04T09:01:00Z'
                completed_job:
                  summary: Succeeded job with creation, start, and finish timestamps
                  value:
                    id: completed-ray-job
                    name: completed-ray-job
                    project: team-alpha-ml
                    status: SUCCEEDED
                    selected_backend: ray
                    submitted_by: alice
                    submission:
                      name: completed-ray-job
                      model:
                        uri: hf://hf-secret-token/Qwen/Qwen2.5-0.5B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                        parameters:
                          learning_rate: 0.00002
                          num_epochs: 3
                    progress:
                      percentage: 100
                      current_epoch: 3
                      total_epochs: 3
                      current_step: 2000
                      total_steps: 2000
                    created_at: '2026-10-04T08:30:00Z'
                    started_at: '2026-10-04T08:31:00Z'
                    finished_at: '2026-10-04T08:50:00Z'
                minimal_submission:
                  summary: API-created job with only required POST fields supplied
                  value:
                    id: minimal-ray-job
                    name: minimal-ray-job
                    project: team-alpha-ml
                    status: PENDING
                    selected_backend: ray
                    submitted_by: bob
                    submission:
                      name: minimal-ray-job
                      model:
                        uri: hf://hf-secret-token/Qwen/Qwen2.5-0.5B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                external_job:
                  summary: External job without submission metadata or submitter attribution
                  value:
                    id: external-ray-job
                    project: team-alpha-ml
                    status: PENDING
                    selected_backend: ray
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

    delete:
      summary: Delete a terminal Ray training job record
      description: >
        Deletes any caller-authorized terminal RayJob in the target namespace,
        including a RayJob not submitted through this API. Uses the caller's
        existing Kubernetes permission. Foreground cascading deletion removes
        the RayJob and its owned RayCluster and pods asynchronously. GPU resources
        become available after those pods terminate; the response does not
        promise instantaneous resource release. Shared or unowned clusters are
        not deleted and return 409. The shared RayJob CRD is never removed.
        A non-terminal job returns 409; this endpoint does not stop or cancel it. It does not delete
        checkpoints or model outputs.
      operationId: deleteTrainingJob
      x-request-context: true
      x-project-authorization:
        group: ray.io
        resource: rayjobs
        verb: delete
        resourceNameParameter: job_id
      tags:
        - Training Jobs
      responses:
        '204':
          description: Terminal RayJob deletion initiated with foreground cascading cleanup of its owned RayCluster and pods
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: RayJob is not terminal, changed concurrently, or does not have an exclusively owned RayCluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: job_not_terminal
                message: Only terminal RayJobs can be deleted.

  /projects/{project}/training-jobs/{job_id}/logs:
    get:
      summary: Read or follow training job driver logs
      description: >
        Verifies caller access to the project and RayJob, then uses the Ray Jobs
        SDK to retrieve driver stdout/stderr as a snapshot or transient
        Server-Sent Events stream. Worker/rank log aggregation and durable log
        storage are out of scope. Logs are available only while the managed
        RayCluster is reachable.
      operationId: streamJobLogs
      x-request-context: true
      x-project-authorization:
        group: ray.io
        resource: rayjobs
        verb: get
        resourceNameParameter: job_id
      tags:
        - Observability
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/JobId'
        - name: follow
          in: query
          description: False returns text/plain; true follows logs as text/event-stream.
          schema:
            type: boolean
            default: false
        - name: tail_lines
          in: query
          description: >
            Number of trailing lines in the non-following snapshot, selected by
            the service after get_job_logs. Ignored when follow=true, which
            forwards the log chunks provided by Ray's tail_job_logs.
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          description: Driver log snapshot or SSE stream, selected by follow
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: log\ndata: {\"message\":\"Epoch 1/5 - loss: 0.241\"}\n\n"
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: RayJob exists, but driver logs are not ready yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: logs_not_ready
                message: Driver logs are not available yet; retry later.
        '410':
          description: RayJob exists, but its managed RayCluster and logs are gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ray_cluster_gone
                message: Driver logs are no longer available because the RayCluster was removed.

  /projects/{project}/queues:
    get:
      summary: List available Kueue LocalQueues in the OpenShift Project (if Kueue is enabled)
      description: >
        Read-only submission helper. Queries Kubernetes APIs directly using the
        caller's identity and permissions in the target project. Kueue is
        optional; if it is not installed or enabled, returns kueue_enabled=false
        and an empty queues list. Does not create, update, or delete queues or
        expose cluster-wide quota information.
      operationId: listQueues
      x-project-authorization:
        group: kueue.x-k8s.io
        resource: localqueues
        verb: list
      tags:
        - Infrastructure & Discovery
      parameters:
        - $ref: '#/components/parameters/Project'
      responses:
        '200':
          description: List of LocalQueues accessible in the specified OpenShift Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInfoResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  securitySchemes:
    OpenShiftBearer:
      type: http
      scheme: bearer
      description: >
        OpenShift bearer token for the caller. The token may be opaque; JWT is
        not assumed. Missing or invalid credentials return 401. If token validation
        or project authorization is temporarily unavailable, requests return 503.
        Authenticated callers without the required project/resource permissions receive 403.
        Validating a token alone does not authorize any job operation. Caller identity
        must be propagated to supported downstream authentication boundaries,
        and caller credentials must not be logged or stored as durable state.

  parameters:
    Project:
      name: project
      in: path
      required: true
      description: >
        Explicit pre-existing OpenShift Project (Kubernetes namespace); all
        resource references are scoped to it. Provision the project through
        normal OpenShift self-service or administrator workflows before using
        this API. The Training API does not create projects or namespaces and
        never falls back to a default namespace or an elevated service identity.
        A missing project returns 404; insufficient caller permissions return 403.
      schema:
        type: string
      example: team-alpha-ml

    JobId:
      name: job_id
      in: path
      required: true
      description: >
        Name of the RayJob custom resource, scoped to the target project. Resolve
        it only through caller-authorized Kubernetes APIs in that project.
      schema:
        type: string
      example: llama3-8b-alpaca-lora

  responses:
    '400BadRequest':
      description: Malformed JSON or invalid query/path parameter syntax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: bad_request
            message: Request JSON or parameters are malformed.
    '401Unauthorized':
      description: Missing, invalid, or expired OpenShift bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unauthorized
            message: A valid OpenShift bearer token is required.
    '403Forbidden':
      description: User lacks OpenShift RBAC permissions for the requested resource or project
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: forbidden
            message: Caller lacks permission for this operation.
    '404NotFound':
      description: Target project, RayJob, or referenced project resource does not exist in the requested scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: Requested resource was not found.
    '415UnsupportedMediaType':
      description: Request body must use application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unsupported_media_type
            message: Request body must use application/json.
    '422UnprocessableEntity':
      description: JSON is well-formed but fails schema or domain validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: validation_error
            message: Request is valid JSON but fails schema or domain validation.
    '503OpenShiftUnavailable':
      description: OpenShift authentication or authorization is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: authentication_unavailable
            message: OpenShift token validation is temporarily unavailable.
    '501NotImplemented':
      description: Requested backend is not implemented in this Developer Preview
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_implemented
            message: The requested backend is not implemented in this Developer Preview.

  schemas:
    JobBackend:
      type: string
      enum: [ray, kft]
      default: ray
      description: Ray is implemented. KFT is retained for compatibility and returns 501 Not Implemented.

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, STOPPED]
      description: >
        RayJob provisioning and waiting states map to PENDING. Ray job execution
        maps to RUNNING, SUCCEEDED, FAILED, or STOPPED. STOPPED may be observed
        if stopped outside this API; it does not imply a DP cancel endpoint.

    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - model
        - dataset
        - algorithm
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 47
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: DNS-1035-compatible RayJob name; limited to 47 characters by the submission path.
          example: llama3-8b-alpaca-lora
        queue_name:
          type: string
          nullable: true
          description: >
            Optional Kueue LocalQueue in the target project. When omitted,
            CodeFlare uses a configured default LocalQueue if one exists;
            otherwise the job is submitted without a queue. Subject to caller
            permissions and platform admission policy; this does not grant access.
          example: team-alpha-local-queue
        backend:
          $ref: '#/components/schemas/JobBackend'
        model:
          $ref: '#/components/schemas/ModelSpec'
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        algorithm:
          $ref: '#/components/schemas/AlgorithmSpec'
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        output:
          $ref: '#/components/schemas/OutputSpec'

    JobEstimationRequest:
      type: object
      additionalProperties: false
      required:
        - model
        - dataset
        - algorithm
      properties:
        model:
          $ref: '#/components/schemas/EstimationModelSpec'
        dataset:
          $ref: '#/components/schemas/EstimationDatasetSpec'
        algorithm:
          $ref: '#/components/schemas/AlgorithmSpec'
        resources:
          $ref: '#/components/schemas/ResourceSpec'

    EstimationModelSpec:
      type: object
      additionalProperties: false
      required: [source, uri]
      properties:
        source:
          type: string
          enum: [huggingface]
        uri:
          type: string
          description: Public Hugging Face model ID or a model available to the profiler without a caller Secret.
          example: meta-llama/Llama-3.2-3B

    EstimationDatasetSpec:
      type: object
      additionalProperties: false
      required: [uri]
      properties:
        uri:
          type: string
          description: Path to a JSONL dataset readable by the timing profiler; no Secret-based access is supported.

    TrainingInputURI:
      type: string
      description: >
        Training API locator for an HF, S3, or PVC model/dataset input. The
        scheme identifies the source and the authority identifies an existing
        Secret, connection, or PVC in the target project. Resolve under the
        caller's existing permissions; do not use an elevated service identity.
        These locators require adapter resolution, not direct SDK passthrough.
        Separate source and secret_ref fields, anonymous HF locators, HTTP,
        and OCI inputs are not supported. Scheme names are case-insensitive.
      oneOf:
        - $ref: '#/components/schemas/HuggingFaceURI'
        - $ref: '#/components/schemas/S3StorageURI'
        - $ref: '#/components/schemas/PVCStorageURI'

    HuggingFaceURI:
      type: string
      format: uri
      pattern: '^[hH][fF]://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/[A-Za-z0-9_][A-Za-z0-9_.-]*(?:/[A-Za-z0-9_][A-Za-z0-9_.-]*)?$(?![\s\S])'
      description: >
        hf://<secret-name>/<hub-repository-id>. The authority is an existing
        project-local Hugging Face credential Secret name, never a token.
        Required for every HF input, including public repositories. The path
        is the full model or dataset repository ID, including its owner/name
        when applicable. No anonymous form, query, fragment, or inline credentials.
      example: hf://hf-secret-token/meta-llama/Llama-3.2-3B

    S3StorageURI:
      type: string
      format: uri
      pattern: '^[sS]3://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/[a-z0-9][a-z0-9.-]*/[^/?#\\\s][^?#\\\s]*$(?![\s\S])'
      description: >
        s3://<connection-name>/<bucket-name>/<path>. The authority names an
        existing project-local S3 connection backed by a Secret, not the bucket
        or an endpoint hostname. The connection supplies endpoint and
        authentication configuration; use the explicit bucket and non-empty
        object key or prefix from this URI, not a connection's default bucket.
        Credential values, userinfo, query strings, and fragments are not accepted.
      example: s3://training-data/my-ml-bucket/datasets/alpaca/train.jsonl

    PVCStorageURI:
      type: string
      format: uri
      pattern: '^[pP][vV][cC]://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/(?!%(?:2[fF]|5[cC]))[^/?#\\\s][^?#\\\s]*$(?![\s\S])'
      not:
        pattern: '(?:/|%2[fF]|%5[cC])(?:\.|%2[eE]){2}(?:/|%2[fF]|%5[cC]|$)'
      description: >
        pvc://<pvc-name>/<path>. The authority names an existing PVC in the
        target project, resolved under caller permissions. The non-empty path
        is relative to the volume root, not a host filesystem path. Reject
        parent-directory traversal, including percent-encoded forms, and
        leading separators or backslashes. Domain validation must also ensure
        the decoded, normalized path cannot escape the volume root. No PVC is
        created automatically; no query string or fragment is accepted.
      example: pvc://training-data/datasets/alpaca/train.jsonl

    ModelSpec:
      type: object
      additionalProperties: false
      description: Model input selected by its project-scoped storage URI.
      required: [uri]
      properties:
        uri:
          $ref: '#/components/schemas/TrainingInputURI'
      example:
        uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B

    DatasetSpec:
      type: object
      additionalProperties: false
      description: Dataset input selected by its project-scoped storage URI.
      required: [uri]
      properties:
        uri:
          $ref: '#/components/schemas/TrainingInputURI'
      example:
        uri: hf://hf-secret-token/tatsu-lab/alpaca

    AlgorithmSpec:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: >
            Algorithm identifier exposed by GET /algorithms for the configured
            Ray Universal Image and release. Use that catalog and its parameter schema.
          example: lora_sft
        parameters:
          type: object
          additionalProperties: true
          description: >
            Optional hyperparameter overrides validated against the selected
            algorithm's Training Hub parameter schema. Basic lora_sft overrides
            include learning_rate, num_epochs, effective_batch_size (total
            samples per optimizer update across GPUs and gradient accumulation),
            and max_seq_len (maximum tokens per training sample). These are
            optional overrides; example values are not API defaults. Omitted
            parameters use the configured backend's defaults.
          example:
            learning_rate: 0.00002
            num_epochs: 3
            effective_batch_size: 8
            max_seq_len: 2048

    ResourceSpec:
      type: object
      additionalProperties: false
      description: >
        The only public source for worker and GPU topology. If omitted, platform
        defaults are applied. Algorithm parameters describe hyperparameters,
        not worker topology.
      properties:
        num_nodes:
          type: integer
          minimum: 1
          default: 1
          example: 2
        gpus_per_node:
          type: integer
          minimum: 0
          default: 1
          example: 4
        gpu_type:
          type: string
          example: nvidia.com/gpu
        cpus_per_node:
          type: string
          default: "8"
          example: "16"
        memory_per_node:
          type: string
          default: "32Gi"
          example: "64Gi"

    OutputSpec:
      type: object
      additionalProperties: false
      required: [destination_uri]
      description: >
        If output is omitted from the request, output is ephemeral. If present,
        destination_uri is required and uses
        s3://<connection-name>/<bucket-name>/<path> or pvc://<pvc-name>/<path>.
        The URI carries a project-local connection or PVC name, not credentials;
        no separate secret_ref is accepted. Resolve under caller permissions,
        without creating connections or PVCs. HF publishing is not supported.
      properties:
        destination_uri:
          type: string
          oneOf:
            - $ref: '#/components/schemas/S3StorageURI'
            - $ref: '#/components/schemas/PVCStorageURI'
      example:
        destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/

    TrainingJobSubmission:
      type: object
      description: >
        Receipt returned after the CodeFlare SDK creates the RayJob resource.
        The id is the RayJob custom resource name, not a Ray Jobs submission ID.
        This acknowledges resource creation only; it does not mean the job has
        started. Reads use caller-authorized Kubernetes APIs and logs use Ray.
      required:
        - id
        - name
        - project
        - selected_backend
        - status
      properties:
        id:
          type: string
          description: Name of the created RayJob custom resource.
          example: llama3-8b-alpaca-lora
        name:
          type: string
          example: llama3-8b-alpaca-lora
        project:
          type: string
          example: team-alpha-ml
        queue_name:
          type: string
          nullable: true
          example: team-alpha-local-queue
        status:
          type: string
          enum: [SUBMITTED]
          description: Submission acknowledgement only; not a lifecycle status.
        selected_backend:
          type: string
          enum: [ray]

    TrainingJobSummary:
      type: object
      additionalProperties: false
      description: >
        Compact list item for a caller-readable RayJob. The id is the RayJob
        name; use the project-scoped detail endpoint for all other job details.
        Optional fields are omitted when unavailable.
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          description: Name of the RayJob custom resource in the requested project.
          example: llama3-8b-alpaca-lora
        status:
          $ref: '#/components/schemas/JobStatus'
        queue_name:
          type: string
          nullable: true
          description: Kueue LocalQueue recorded in training submission metadata, when available.
          example: team-alpha-local-queue
        created_at:
          type: string
          format: date-time
          description: >
            RayJob resource creation timestamp from Kubernetes
            metadata.creationTimestamp, in RFC 3339 format. Present for all
            persisted RayJobs, including externally created jobs; not the
            training start time.

    TrainingJob:
      type: object
      description: >
        Current view assembled from a caller-authorized RayJob resource and
        available Ray status. Includes caller-readable RayJobs regardless of
        whether they were created by this API. Optional fields are omitted when
        unavailable; the service does not persist job state. API-created jobs
        include their accepted POST payload in submission. External or older
        jobs without recorded submission metadata omit that field.
      required:
        - id
        - project
        - status
        - selected_backend
      properties:
        id:
          type: string
          description: Name of the RayJob custom resource in the project.
          example: llama3-8b-alpaca-lora
        name:
          type: string
          example: llama3-8b-alpaca-lora
        project:
          type: string
          example: team-alpha-ml
        submitted_by:
          type: string
          readOnly: true
          description: >
            Original submitter's OpenShift username, resolved from the
            authenticated submission token and recorded in the RayJob annotation
            training.rhoai.io/submitted-by. May be a human username or a service
            account identity such as system:serviceaccount:team-alpha-ml:training-client.
            Never supplied by a client or inferred from the caller reading the
            job. Omitted when the annotation is absent. Informational attribution
            only, not tamper-proof audit evidence and never used for authorization.
          example: alice
        submission:
          readOnly: true
          description: >
            Accepted POST payload retained for API-created jobs in
            caller-authorized RayJob metadata. Preserves submitted values,
            including model, dataset, algorithm parameters, and any supplied
            queue, backend, resources, or output settings. Optional fields and
            nested defaults that were not supplied remain absent; this is not
            the effective runtime configuration. Omitted for external or older
            jobs without recorded submission metadata; never reconstructed from
            command-line arguments or raw runtime environments. Storage URIs
            contain project-local Secret, connection, or PVC names only,
            never credentials or Secret contents.
          allOf:
            - $ref: '#/components/schemas/CreateJobRequest'
        queue_name:
          type: string
          nullable: true
          example: team-alpha-local-queue
        status:
          $ref: '#/components/schemas/JobStatus'
        selected_backend:
          type: string
          enum: [ray]
          example: ray
        progress:
          type: object
          description: Optional training progress, only when reported by an authorized source.
          properties:
            percentage:
              type: number
              format: float
              example: 45.5
            current_epoch:
              type: integer
              example: 2
            total_epochs:
              type: integer
              example: 5
            current_step:
              type: integer
              example: 910
            total_steps:
              type: integer
              example: 2000
            eta_seconds:
              type: integer
              example: 1240
        metrics:
          type: object
          description: Optional training metrics, only when reported by an authorized source.
          additionalProperties:
            type: number
          example:
            loss: 0.184
            eval_loss: 0.212
            learning_rate: 0.00015
            throughput_tokens_per_sec: 1420.5
        resources:
          description: >
            Runtime resource configuration from an authorized source, when
            available. Do not infer it solely from requested resources;
            submission.resources preserves the submitted settings separately.
          allOf:
            - $ref: '#/components/schemas/ResourceSpec'
        created_at:
          type: string
          format: date-time
          description: >
            RayJob resource creation timestamp from Kubernetes
            metadata.creationTimestamp, in RFC 3339 format, including for
            externally created jobs. Distinct from the training start time
            reported in started_at.
        started_at:
          type: string
          format: date-time
          description: Ray start timestamp converted from Unix milliseconds to RFC 3339.
        finished_at:
          type: string
          format: date-time
          description: >
            Ray execution end timestamp in RFC 3339 format, when reported for
            a terminal SUCCEEDED, FAILED, or STOPPED job. Omitted while pending
            or running, or when Ray has not reported an end time. Never inferred
            from the current time or resource creation time.
        failure_reason:
          type: string
          description: Ray failure message when status is FAILED, if available.

    JobEstimationResponse:
      type: object
      required: [gpu_memory_bytes_per_device]
      properties:
        gpu_memory_bytes_per_device:
          type: object
          required: [lower_bound, expected, upper_bound]
          properties:
            lower_bound:
              type: integer
              format: int64
              minimum: 0
            expected:
              type: integer
              format: int64
              minimum: 0
            upper_bound:
              type: integer
              format: int64
              minimum: 0
          description: Memory estimate per GPU returned by the Training Hub profiler, in bytes.
        estimated_duration_seconds:
          type: object
          required: [lower_bound, upper_bound]
          properties:
            lower_bound:
              type: integer
              format: int64
              minimum: 0
            upper_bound:
              type: integer
              format: int64
              minimum: 0
          description: >
            Optional timing range in seconds. Omitted when the selected method
            has no timing estimator; timing is currently experimental and
            supported only for single-node SFT/OSFT.
        warnings:
          type: array
          items:
            type: string
          example:
            - "Timing estimation is unavailable for this algorithm; memory estimate returned without duration."

    QueueInfoResponse:
      type: object
      required: [kueue_enabled, queues]
      properties:
        kueue_enabled:
          type: boolean
          description: False when Kueue is absent or disabled in the target deployment.
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueInfo'

    QueueInfo:
      type: object
      properties:
        name:
          type: string
          example: team-alpha-local-queue
        cluster_queue:
          type: string
          example: gpu-cluster-queue

    AlgorithmDescriptor:
      type: object
      required: [name, supported_backends, parameter_schema]
      properties:
        name:
          type: string
          example: lora_sft
        description:
          type: string
          example: Low-Rank Adaptation Supervised Fine-Tuning
        supported_backends:
          type: array
          items:
            type: string
            enum: [ray]
          example: ["ray"]
        parameter_schema:
          type: object
          description: JSON Schema for parameters accepted by this algorithm in the configured image.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - already_exists
            - job_not_terminal
            - logs_not_ready
            - ray_cluster_gone
            - unsupported_media_type
            - validation_error
            - authentication_unavailable
            - authorization_unavailable
            - not_implemented
          example: forbidden
        message:
          type: string
          example: "Caller is not authorized to perform this operation in project team-alpha-ml."
        details:
          type: object
          additionalProperties: true
          description: Optional structured context, such as invalid fields; never includes credentials.
