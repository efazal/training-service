openapi: 3.0.3
info:
  title: "Training API"
  description: >-
    Submit and manage model fine-tuning jobs. Discover training algorithms, configure training
    resources, monitor job status, and retrieve logs.
  version: "0.1.0"
servers:
  - url: "/api/v1"

tags:
  - name: Training Jobs
    description: Submit and manage training jobs.
  - name: Infrastructure & Discovery
    description: Discover training algorithms and queues.
  - name: Observability
    description: Read and follow training job logs.

security:
  - OpenShiftBearer: []

paths:
  /algorithms:
    get:
      summary: "List training algorithms"
      description: >-
        List the algorithms registered in the configured training environment. Follow
        details_url for parameter definitions and submission requirements.
      operationId: listAlgorithms
      x-request-context: true
      tags:
        - Infrastructure & Discovery
      responses:
        '200':
          description: "Training algorithms and links to their details."
          content:
            application/json:
              schema:
                type: object
                required:
                  - algorithms
                properties:
                  algorithms:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlgorithmDescriptor'
                  runtime:
                    $ref: '#/components/schemas/AlgorithmRuntime'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /algorithms/{name}:
    get:
      summary: "Get algorithm details"
      description: >-
        Return the algorithm's parameters, required fields, defaults, and usage notes. Set
        include=parameter_schema to retrieve its JSON Schema.
      operationId: getAlgorithm
      x-request-context: true
      tags:
        - Infrastructure & Discovery
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: "Set to parameter_schema to include the complete parameter validation schema."
          schema:
            type: string
            enum: [parameter_schema]
      responses:
        '200':
          description: "Algorithm details and parameter definitions."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmDetails'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'

  /projects/{project}/training-jobs:
    post:
      summary: "Submit a training job"
      description: >-
        Validate and submit a training job in the specified project. Reference existing model,
        dataset, and optional output storage in that project. The response confirms acceptance;
        use the returned ID to check status or retrieve logs.
      operationId: createTrainingJob
      x-submission-context: true
      x-project-authorization:
        useJobBackend: true
        group: ray.io
        resource: rayjobs
        verb: create
      tags:
        - Training Jobs
      parameters:
        - $ref: '#/components/parameters/Project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            examples:
              huggingface_inputs_s3_output:
                summary: "Hugging Face inputs and S3 output"
                value:
                  name: llama3-8b-alpaca-lora
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B
                  dataset:
                    uri: hf://hf-secret-token/tatsu-lab/alpaca
                  algorithm:
                    name: lora_sft
                  resources:
                    num_nodes: 1
                    gpus_per_node: 1
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "4"
                    memory_per_node: "16Gi"
                  output:
                    destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/
              s3_inputs:
                summary: "S3 inputs and output"
                value:
                  name: s3-training
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: s3://model-storage/my-ml-bucket/models/llama3/
                  dataset:
                    uri: s3://training-data/my-ml-bucket/datasets/alpaca/train.jsonl
                  algorithm:
                    name: lora_sft
                  resources:
                    num_nodes: 1
                    gpus_per_node: 1
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "4"
                    memory_per_node: "16Gi"
                  output:
                    destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/s3-training/
              pvc_inputs_output:
                summary: "PVC inputs and output"
                value:
                  name: pvc-training
                  queue_name: team-alpha-local-queue
                  backend: ray
                  model:
                    uri: pvc://model-storage/models/llama3/
                  dataset:
                    uri: pvc://training-data/datasets/alpaca/train.jsonl
                  algorithm:
                    name: lora_sft
                  resources:
                    num_nodes: 1
                    gpus_per_node: 1
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "4"
                    memory_per_node: "16Gi"
                  output:
                    destination_uri: pvc://training-output/checkpoints/pvc-training/
              grpo_hf_inputs_pvc_output:
                summary: "LoRA GRPO training"
                value:
                  name: grpo-toucan
                  backend: ray
                  model:
                    uri: hf://hf-secret-token/Qwen/Qwen3-4B
                  dataset:
                    uri: hf://hf-secret-token/Agent-Ark/Toucan-1.5M
                  algorithm:
                    name: lora_grpo
                  resources:
                    num_nodes: 2
                    gpus_per_node: 4
                    gpu_type: nvidia.com/gpu
                    cpus_per_node: "8"
                    memory_per_node: "192Gi"
                  output:
                    destination_uri: pvc://training-output/checkpoints/grpo-toucan/
      responses:
        '202':
          description: "Job accepted for asynchronous execution."
          headers:
            Location:
              description: "Relative URL of the submitted job."
              schema:
                type: string
              example: /api/v1/projects/team-alpha-ml/training-jobs/llama3-8b-alpaca-lora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJobSubmission'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          description: "Training submission is temporarily unavailable."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: submission_unavailable
                message: RayJob submission is unavailable.
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: "A job with this name already exists in the project."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: already_exists
                message: A RayJob with this name already exists in the project.
        '415':
          $ref: '#/components/responses/415UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
        '501':
          $ref: '#/components/responses/501NotImplemented'

    get:
      summary: "List training jobs"
      description: >-
        Return a paginated list of accessible jobs, including jobs submitted outside this API.
        Omit status to include all job states. Use the detail endpoint for each job's full
        configuration.
      operationId: listTrainingJobs
      x-request-context: true
      x-project-authorization:
        useJobBackend: true
        group: ray.io
        resource: rayjobs
        verb: list
      tags:
        - Training Jobs
      parameters:
        - $ref: '#/components/parameters/Project'
        - name: status
          in: query
          required: false
          description: >-
            Filter by an exact job state. Omit to include all states.
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: queue_name
          in: query
          required: false
          description: "Filter by the queue name recorded for the job."
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: page_token
          in: query
          description: >-
            Continuation token from the previous page. Use the same project and filters.
          schema:
            type: string
      responses:
        '200':
          description: "A page of training jobs and the total matching count."
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total_count
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrainingJobSummary'
                  total_count:
                    type: integer
                    format: int64
                    minimum: 0
                    description: >-
                      Total accessible jobs matching the filters, before pagination. This count
                      may change between requests.
                  next_page_token:
                    type: string
                    description: "Token for the next page. Omitted when there are no further results."
              examples:
                jobs:
                  summary: Jobs in multiple states
                  value:
                    total_count: 12
                    items:
                      - id: llama3-8b-alpaca-lora
                        status: RUNNING
                        queue_name: team-alpha-local-queue
                        created_at: '2026-10-04T09:00:00Z'
                      - id: external-ray-job
                        status: PENDING
                        created_at: '2026-10-04T09:05:00Z'
                      - id: completed-ray-job
                        status: SUCCEEDED
                        created_at: '2026-10-04T08:30:00Z'
                      - id: failed-ray-job
                        status: FAILED
                        created_at: '2026-10-04T08:00:00Z'
                      - id: externally-stopped-ray-job
                        status: STOPPED
                        created_at: '2026-10-04T07:30:00Z'
                    next_page_token: opaque-next-page-token
                filtered_by_status:
                  summary: Running jobs
                  value:
                    total_count: 1
                    items:
                      - id: llama3-8b-alpaca-lora
                        status: RUNNING
                        queue_name: team-alpha-local-queue
                        created_at: '2026-10-04T09:00:00Z'
                empty_project:
                  summary: No matching jobs
                  value:
                    total_count: 0
                    items: []
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /projects/{project}/training-jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/JobId'

    get:
      summary: "Get a training job"
      description: >-
        Return the job's current status, submitted configuration, timestamps, and available
        metrics. Fields are omitted when unavailable; submission and submitter details are
        included when recorded.
      operationId: getTrainingJob
      x-request-context: true
      x-project-authorization:
        useJobBackend: true
        group: ray.io
        resource: rayjobs
        verb: get
        resourceNameParameter: job_id
      tags:
        - Training Jobs
      responses:
        '200':
          description: "Current job status and available details."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingJob'
              examples:
                api_submitted_job:
                  summary: Job details and submitted configuration
                  value:
                    id: llama3-8b-alpaca-lora
                    name: llama3-8b-alpaca-lora
                    project: team-alpha-ml
                    status: RUNNING
                    selected_backend: ray
                    queue_name: team-alpha-local-queue
                    submitted_by: alice
                    submission:
                      name: llama3-8b-alpaca-lora
                      queue_name: team-alpha-local-queue
                      backend: ray
                      model:
                        uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                      resources:
                        num_nodes: 2
                        gpus_per_node: 4
                        gpu_type: nvidia.com/gpu
                        cpus_per_node: "16"
                        memory_per_node: "64Gi"
                      output:
                        destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/
                    progress:
                      percentage: 45.5
                      current_epoch: 2
                      total_epochs: 3
                      current_step: 910
                      total_steps: 2000
                      eta_seconds: 1240
                    metrics:
                      loss: 0.184
                      eval_loss: 0.212
                      learning_rate: 0.000015
                      throughput_tokens_per_sec: 1420.5
                    resources:
                      num_nodes: 2
                      gpus_per_node: 4
                      gpu_type: nvidia.com/gpu
                      cpus_per_node: "16"
                      memory_per_node: "64Gi"
                    created_at: '2026-10-04T09:00:00Z'
                    started_at: '2026-10-04T09:01:00Z'
                completed_job:
                  summary: Completed job
                  value:
                    id: completed-ray-job
                    name: completed-ray-job
                    project: team-alpha-ml
                    status: SUCCEEDED
                    selected_backend: ray
                    submitted_by: alice
                    submission:
                      name: completed-ray-job
                      model:
                        uri: hf://hf-secret-token/Qwen/Qwen2.5-0.5B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                    progress:
                      percentage: 100
                      current_epoch: 3
                      total_epochs: 3
                      current_step: 2000
                      total_steps: 2000
                    created_at: '2026-10-04T08:30:00Z'
                    started_at: '2026-10-04T08:31:00Z'
                    finished_at: '2026-10-04T08:50:00Z'
                minimal_submission:
                  summary: Job submitted with required fields only
                  value:
                    id: minimal-ray-job
                    name: minimal-ray-job
                    project: team-alpha-ml
                    status: PENDING
                    selected_backend: ray
                    submitted_by: bob
                    submission:
                      name: minimal-ray-job
                      model:
                        uri: hf://hf-secret-token/Qwen/Qwen2.5-0.5B
                      dataset:
                        uri: hf://hf-secret-token/tatsu-lab/alpaca
                      algorithm:
                        name: lora_sft
                external_job:
                  summary: Job submitted outside this API
                  value:
                    id: external-ray-job
                    project: team-alpha-ml
                    status: PENDING
                    selected_backend: ray
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

    delete:
      summary: "Delete a training job"
      description: >-
        Delete a job and stop any active execution. Cleanup is asynchronous: 204 acknowledges
        the request; poll the job until GET returns 404. Saved inputs and outputs are preserved.
        Jobs with shared or unverified cluster ownership cannot be deleted.
      operationId: deleteTrainingJob
      x-request-context: true
      x-project-authorization:
        useJobBackend: true
        group: ray.io
        resource: rayjobs
        verb: delete
        resourceNameParameter: job_id
      tags:
        - Training Jobs
      responses:
        '204':
          description: "Deletion accepted; cleanup is in progress."
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: >-
            The job changed concurrently or its training cluster is shared or not exclusively
            owned. Refresh and retry only concurrent-change conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    code: conflict
                    message: The operation conflicts with the current resource state. Refresh and retry.
                shared_cluster:
                  value:
                    code: shared_cluster
                    message: Shared RayClusters cannot be deleted by this API.
                unowned_cluster:
                  value:
                    code: unowned_cluster
                    message: RayCluster is not exclusively owned by this RayJob.

  /projects/{project}/training-jobs/{job_id}/logs:
    get:
      summary: "Get training job logs"
      description: >-
        Return console logs as a snapshot or a Server-Sent Events (SSE) stream. Logs are
        available while the training cluster is reachable. Follow connections are bounded by the
        deployment's time limit. On expiry, a stream_expired error event closes the stream;
        reconnect to continue reading. Disconnection does not stop training.
      operationId: streamJobLogs
      x-request-context: true
      x-project-authorization:
        useJobBackend: true
        group: ray.io
        resource: rayjobs
        verb: get
        resourceNameParameter: job_id
      tags:
        - Observability
      parameters:
        - $ref: '#/components/parameters/Project'
        - $ref: '#/components/parameters/JobId'
        - name: follow
          in: query
          description: "Return a text/plain snapshot when false, or a text/event-stream when true."
          schema:
            type: boolean
            default: false
        - name: tail_lines
          in: query
          description: >-
            Number of trailing lines returned in a snapshot. Ignored when follow=true.
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: timeout_seconds
          in: query
          description: >-
            Maximum duration in seconds for a follow connection. Omission uses the deployment
            limit (300 seconds by default); larger values are capped at that limit. Supply a
            positive integer without signs, leading zeros, or decimals. Invalid values return
            400; valid values are ignored when follow=false.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: "Log snapshot or SSE stream, selected by follow."
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: log\ndata: {\"message\":\"Epoch 1/5 - loss: 0.241\"}\n\n"
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: "The job exists, but logs are not ready."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: logs_not_ready
                message: Driver logs are not available yet; retry later.
        '410':
          description: "The training cluster and its logs are no longer available."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ray_cluster_gone
                message: Logs are no longer available because the training cluster was removed.

  /projects/{project}/queues:
    get:
      summary: "List training queues"
      description: >-
        Queue discovery is not available in this release and returns 501.
      operationId: listQueues
      x-project-authorization:
        group: kueue.x-k8s.io
        resource: localqueues
        verb: list
      tags:
        - Infrastructure & Discovery
      parameters:
        - $ref: '#/components/parameters/Project'
      responses:
        '200':
          description: "Training queues in the project."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueInfoResponse'
        '501':
          $ref: '#/components/responses/501NotImplemented'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503OpenShiftUnavailable'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  securitySchemes:
    OpenShiftBearer:
      type: http
      scheme: bearer
      description: >-
        Use an OpenShift bearer token. Access is limited by the caller's project and resource
        permissions.
  parameters:
    Project:
      name: project
      in: path
      required: true
      description: >-
        Existing OpenShift project containing the job and its referenced storage and queues.
      schema:
        type: string
      example: team-alpha-ml

    JobId:
      name: job_id
      in: path
      required: true
      description: >-
        Job ID returned at submission, scoped to the specified project.
      schema:
        type: string
      example: llama3-8b-alpaca-lora

  responses:
    '400BadRequest':
      description: "Malformed JSON or invalid path or query parameters."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: bad_request
            message: Request JSON or parameters are malformed.
    '401Unauthorized':
      description: "Missing, invalid, or expired bearer token."
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unauthorized
            message: A valid OpenShift bearer token is required.
    '403Forbidden':
      description: "Insufficient permissions for the requested project or resource."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: forbidden
            message: Caller lacks permission for this operation.
    '404NotFound':
      description: "The project, job, or referenced resource was not found."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_found
            message: Requested resource was not found.
    '415UnsupportedMediaType':
      description: "Request body must use application/json."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: unsupported_media_type
            message: Request body must use application/json.
    '422UnprocessableEntity':
      description: "Request fields or training parameters failed validation."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: validation_error
            message: Request is valid JSON but fails schema or domain validation.
    '503OpenShiftUnavailable':
      description: "The service or a required dependency is temporarily unavailable."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: authentication_unavailable
            message: OpenShift token validation is temporarily unavailable.
    '501NotImplemented':
      description: "The requested operation or training backend is not available."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: not_implemented
            message: The requested backend is not implemented in this Developer Preview.

  schemas:
    JobBackend:
      type: string
      enum: [ray, kft]
      default: ray
      description: "Training backend. Currently supports ray; kft requests return 501."

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, STOPPED]
      description: >-
        Current job state. PENDING includes jobs waiting for resources or startup.
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - model
        - dataset
        - algorithm
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 47
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          description: "Job name: 1-47 lowercase letters, digits, or hyphens; start with a letter and end with a letter or digit."
          example: llama3-8b-alpaca-lora
        queue_name:
          type: string
          nullable: true
          description: >-
            Queue in the target project. If omitted, a configured default queue is used;
            otherwise submission is unqueued.
          example: team-alpha-local-queue
        backend:
          $ref: '#/components/schemas/JobBackend'
        model:
          $ref: '#/components/schemas/ModelSpec'
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        algorithm:
          $ref: '#/components/schemas/AlgorithmSpec'
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        output:
          $ref: '#/components/schemas/OutputSpec'

    TrainingInputURI:
      type: string
      description: >-
        Model or dataset location using an hf://, s3://, or pvc:// URI. Reference existing
        resources in the target project. URI schemes are case-insensitive; inline credentials
        are not accepted.
      oneOf:
        - $ref: '#/components/schemas/HuggingFaceURI'
        - $ref: '#/components/schemas/S3StorageURI'
        - $ref: '#/components/schemas/PVCStorageURI'

    HuggingFaceURI:
      type: string
      format: uri
      pattern: '^[hH][fF]://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/[A-Za-z0-9_][A-Za-z0-9_.-]*(?:/[A-Za-z0-9_][A-Za-z0-9_.-]*)?$(?![\s\S])'
      description: >-
        Hugging Face repository URI: `hf://<secret-name>/<repository-id>`. A credential Secret
        in the target project is required, including for public repositories.
      example: hf://hf-secret-token/meta-llama/Llama-3.2-3B

    S3StorageURI:
      type: string
      format: uri
      pattern: '^[sS]3://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/[a-z0-9][a-z0-9.-]*/[^/?#\\\s][^?#\\\s]*$(?![\s\S])'
      description: >-
        S3 location: `s3://<connection-name>/<bucket-name>/<path>`. Reference a connection in
        the target project for endpoint and credentials; specify the bucket and path in the URI.
      example: s3://training-data/my-ml-bucket/datasets/alpaca/train.jsonl

    PVCStorageURI:
      type: string
      format: uri
      pattern: '^[pP][vV][cC]://[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]*[a-z0-9])?)*/(?!%(?:2[fF]|5[cC]))[^/?#\\\s][^?#\\\s]*$(?![\s\S])'
      not:
        pattern: '(?:/|%2[fF]|%5[cC])(?:\.|%2[eE]){2}(?:/|%2[fF]|%5[cC]|$)'
      description: >-
        Volume location: `pvc://<pvc-name>/<path>`. Reference an existing PVC in the target
        project. The path is relative to the volume root; parent-directory traversal is not
        allowed.
      example: pvc://training-data/datasets/alpaca/train.jsonl

    ModelSpec:
      type: object
      additionalProperties: false
      description: "Model location in the target project."
      required: [uri]
      properties:
        uri:
          $ref: '#/components/schemas/TrainingInputURI'
      example:
        uri: hf://hf-secret-token/meta-llama/Llama-3.2-3B

    DatasetSpec:
      type: object
      additionalProperties: false
      description: >-
        Training dataset location. The config and split options apply to Hugging Face datasets
        for SFT, OSFT, and LoRA SFT. For LoRA GRPO, use the algorithm's data_config parameter.
      required: [uri]
      properties:
        uri:
          $ref: '#/components/schemas/TrainingInputURI'
        config:
          type: string
          minLength: 1
          description: "Hugging Face dataset configuration name."
        split:
          type: string
          minLength: 1
          description: "Hugging Face dataset split. Defaults to train."
      example:
        uri: hf://hf-secret-token/tatsu-lab/alpaca

    AlgorithmSpec:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: >-
            Algorithm identifier from the training catalog. Availability depends on the
            configured training environment.
          example: lora_sft
        parameters:
          type: object
          additionalProperties: true
          description: >-
            Algorithm-specific settings. Use the algorithm detail endpoint for accepted
            parameters and defaults. Configure node and GPU counts in resources.
    ResourceSpec:
      type: object
      additionalProperties: false
      description: >-
        Node and accelerator requirements. Multi-node jobs require ReadWriteMany access for
        shared PVC storage.
      properties:
        num_nodes:
          type: integer
          minimum: 1
          default: 1
          example: 2
        gpus_per_node:
          type: integer
          minimum: 0
          default: 1
          example: 4
        gpu_type:
          type: string
          example: nvidia.com/gpu
        cpus_per_node:
          type: string
          default: "4"
          example: "4"
        memory_per_node:
          type: string
          default: "16Gi"
          example: "16Gi"

    OutputSpec:
      type: object
      additionalProperties: false
      required: [destination_uri]
      description: >-
        Destination for saved training output. Supports existing S3 connections and PVCs. If
        omitted, output is ephemeral.
      properties:
        destination_uri:
          type: string
          oneOf:
            - $ref: '#/components/schemas/S3StorageURI'
            - $ref: '#/components/schemas/PVCStorageURI'
      example:
        destination_uri: s3://checkpoint-storage/my-ml-bucket/checkpoints/llama3-lora/

    TrainingJobSubmission:
      type: object
      description: >-
        Submission receipt. Use the job ID to check status or retrieve logs; acceptance does not
        mean training has started.
      required:
        - id
        - name
        - project
        - selected_backend
        - status
      properties:
        id:
          type: string
          description: "Job ID for status, logs, and deletion requests."
          example: llama3-8b-alpaca-lora
        name:
          type: string
          example: llama3-8b-alpaca-lora
        project:
          type: string
          example: team-alpha-ml
        queue_name:
          type: string
          nullable: true
          example: team-alpha-local-queue
        status:
          type: string
          enum: [SUBMITTED]
          description: "Submission acknowledgement; check job details for the current execution state."
        selected_backend:
          type: string
          enum: [ray]

    TrainingJobSummary:
      type: object
      additionalProperties: false
      description: >-
        Job summary returned in a list. Use the detail endpoint for the full job configuration.
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          description: "Job ID within the project."
          example: llama3-8b-alpaca-lora
        status:
          $ref: '#/components/schemas/JobStatus'
        queue_name:
          type: string
          nullable: true
          description: "Recorded training queue, when available."
          example: team-alpha-local-queue
        created_at:
          type: string
          format: date-time
          description: >-
            Job creation time in RFC 3339 format; distinct from the training start time.
    TrainingJob:
      type: object
      description: >-
        Current job status and available details. Optional fields are omitted when unavailable.
      required:
        - id
        - project
        - status
        - selected_backend
      properties:
        id:
          type: string
          description: "Job ID within the project."
          example: llama3-8b-alpaca-lora
        name:
          type: string
          example: llama3-8b-alpaca-lora
        project:
          type: string
          example: team-alpha-ml
        submitted_by:
          type: string
          readOnly: true
          description: >-
            Username of the original submitter, when recorded. This informational field does not
            determine access permissions.
          example: alice
        submission:
          readOnly: true
          description: >-
            Original accepted request, preserving supplied values. Omitted for jobs without
            recorded submission details.
          allOf:
            - $ref: '#/components/schemas/CreateJobRequest'
        queue_name:
          type: string
          nullable: true
          example: team-alpha-local-queue
        status:
          $ref: '#/components/schemas/JobStatus'
        selected_backend:
          type: string
          enum: [ray]
          example: ray
        progress:
          type: object
          description: "Training progress, when available."
          properties:
            percentage:
              type: number
              format: float
              example: 45.5
            current_epoch:
              type: integer
              example: 2
            total_epochs:
              type: integer
              example: 5
            current_step:
              type: integer
              example: 910
            total_steps:
              type: integer
              example: 2000
            eta_seconds:
              type: integer
              example: 1240
        metrics:
          type: object
          description: "Training metrics, when available."
          additionalProperties:
            type: number
          example:
            loss: 0.184
            eval_loss: 0.212
            learning_rate: 0.00015
            throughput_tokens_per_sec: 1420.5
        resources:
          description: >-
            Observed runtime resources, when available. Requested resources are retained
            separately in submission.resources.
          allOf:
            - $ref: '#/components/schemas/ResourceSpec'
        created_at:
          type: string
          format: date-time
          description: >-
            Job creation time in RFC 3339 format.
        started_at:
          type: string
          format: date-time
          description: "Training start time in RFC 3339 format, when available."
        finished_at:
          type: string
          format: date-time
          description: >-
            Training completion time in RFC 3339 format. Omitted until a terminal job reports
            its end time.
        failure_reason:
          type: string
          description: "Failure message for a failed job, when available."

    QueueInfoResponse:
      type: object
      required: [kueue_enabled, queues]
      properties:
        kueue_enabled:
          type: boolean
          description: "Whether training queues are enabled for the deployment."
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueInfo'

    QueueInfo:
      type: object
      properties:
        name:
          type: string
          example: team-alpha-local-queue
        cluster_queue:
          type: string
          example: gpu-cluster-queue

    AlgorithmDescriptor:
      type: object
      required: [name, description, supported_backends, details_url]
      properties:
        name:
          type: string
          example: lora_sft
        description:
          type: string
          maxLength: 240
          example: Supervised fine-tuning using LoRA adapters.
        supported_backends:
          type: array
          items:
            type: string
          example: ["ray"]
        details_url:
          type: string
          example: /api/v1/algorithms/lora_sft

    AlgorithmRuntime:
      type: object
      required: [image, training_hub_version, registry_sha256]
      properties:
        image:
          type: string
        training_hub_version:
          type: string
        registry_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    AlgorithmParameter:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
        description:
          type: string
        nullable:
          type: boolean
        default: {}
        example: {}
        choices:
          type: array
          items: {}

    AlgorithmDetails:
      allOf:
        - $ref: '#/components/schemas/AlgorithmDescriptor'
        - type: object
          required: [required_parameters, parameters, parameter_schema_url, notes]
          properties:
            required_parameters:
              type: array
              items:
                type: string
            parameters:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/AlgorithmParameter'
            parameter_schema_url:
              type: string
            parameter_schema:
              type: object
              description: "Parameter validation schema, included only with include=parameter_schema."
            runtime:
              $ref: '#/components/schemas/AlgorithmRuntime'
            notes:
              type: array
              items:
                type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - already_exists
            - logs_not_ready
            - ray_cluster_gone
            - unsupported_media_type
            - validation_error
            - authentication_unavailable
            - authorization_unavailable
            - submission_unavailable
            - not_implemented
            - backend_unavailable
            - conflict
            - invalid_page_token
            - unowned_cluster
            - shared_cluster
            - logs_unavailable
            - stream_expired
          example: forbidden
        message:
          type: string
          example: "Caller is not authorized to perform this operation in project team-alpha-ml."
        details:
          type: object
          additionalProperties: true
          description: "Additional error context, such as invalid fields."
